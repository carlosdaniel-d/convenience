<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>convenienceIA - Santo Domingo</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --neon-green: #00E676;
      --neon-blue: #00b0ff;
      --card-bg: rgba(20, 20, 20, 0.92);
      --border-color: rgba(0, 230, 118, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; background: var(--bg-dark); color: #fff; overflow: hidden; }

    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Barra Superior */
    .top-bar {
      position: fixed;
      top: 15px; left: 15px; right: 15px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    }
    .brand { font-weight: 900; font-size: 15px; color: var(--neon-green); display: flex; align-items: center; gap: 6px; }
    .top-btn { background: rgba(0,230,118,0.15); border: 1px solid var(--neon-green); color: var(--neon-green); padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; }

    /* Menú Maestro Flotante */
    .menu-master-flotante {
      position: fixed; bottom: 30px; left: 15px; z-index: 10000;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
      color: #000; border: none; padding: 12px 18px; border-radius: 22px;
      font-size: 13px; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 230, 118, 0.5);
      display: flex; align-items: center; gap: 6px;
    }

    .acordeon-lateral-box {
      position: fixed; bottom: 85px; left: 15px; z-index: 9999;
      background: var(--card-bg); border: 1px solid var(--neon-green);
      backdrop-filter: blur(12px); border-radius: 18px; padding: 12px; width: 230px;
      display: flex; flex-direction: column; gap: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      transform: translateY(20px); opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.1, 1, 0.1, 1);
    }
    .acordeon-lateral-box.active { transform: translateY(0); opacity: 1; pointer-events: auto; }

    .btn-opcion-acordeon {
      background: #151515; border: 1px solid #333; color: #fff;
      padding: 8px 10px; border-radius: 10px; font-size: 11px; font-weight: bold;
      text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .btn-opcion-acordeon:hover { background: #222; border-color: var(--neon-green); color: var(--neon-green); }

    /* Pines de Comercios Neon */
    .pin-masivo-neon {
      background: #141414 !important; border: 2px solid var(--neon-green) !important;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.9) !important;
      border-radius: 50% !important; width: 38px !important; height: 38px !important;
      display: flex !important; align-items: center !important; justify-content: center !important;
      font-size: 16px !important; z-index: 1000 !important;
    }

    /* Splash Screen */
    .splash-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #080808; z-index: 9999999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .splash-overlay.hidden { opacity: 0; visibility: hidden; }
    .splash-logo { width: 85px; height: 85px; background: rgba(0,230,118,0.15); border: 2px solid var(--neon-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 16px; box-shadow: 0 0 30px rgba(0,230,118,0.5); }

    /* Call Noti Banner */
    .call-noti-banner {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%) translateY(-150%);
      width: 92%; max-width: 380px; background: rgba(18,18,18,0.96); border: 1px solid var(--neon-green);
      border-radius: 20px; padding: 12px 16px; z-index: 999999; backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between; transition: transform 0.4s cubic-bezier(0.1, 1, 0.1, 1);
    }
    .call-noti-banner.active { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Splash Screen Primera Vez -->
  <div id="splash-bienvenida" class="splash-overlay">
    <div class="splash-logo">⚡</div>
    <h1 style="color: var(--neon-green); font-size: 22px; font-weight: 900; margin-bottom: 8px;">convenienceIA SD</h1>
    <p style="font-size: 12px; color: #ccc; max-width: 310px; line-height: 1.5; margin-bottom: 24px;">
      El ecosistema inteligente de delivery en Santo Domingo (Girasoles, Pantoja, Herrera, Piantini y más). Pedidos express, IA y comercios 24/7.
    </p>
    <button onclick="cerrarSplash()" style="background:var(--neon-green); color:#000; border:none; padding:12px 28px; border-radius:16px; font-weight:900; font-size:12px; cursor:pointer;">Comenzar 🚀</button>
  </div>

  <!-- Mapa Interactivo -->
  <div id="map"></div>

  <!-- Barra Superior -->
  <div class="top-bar">
    <div class="brand">🟢 convenienceIA</div>
    <div style="display:flex; gap:8px;">
      <button class="top-btn" onclick="alert('💳 Saldo ConveniencePay: RD$ 2,450.00')">Monedero</button>
      <button class="top-btn" onclick="alert('🤖 Asistente IA WhatsApp/IG activo y respondiendo clientes.')">IA Bot</button>
    </div>
  </div>

  <!-- Menú Maestro Acordeón -->
  <button class="menu-master-flotante" onclick="toggleMenuMaster()">⚡ Menú Rápido SD</button>
  <div id="acordeon-lateral" class="acordeon-lateral-box">
    <span style="font-size:9px; color:#888; font-weight:bold; text-transform:uppercase; border-bottom:1px solid #333; padding-bottom:4px;">Herramientas VIP</span>
    <button class="btn-opcion-acordeon" onclick="lanzarCallNoti('🛵 Repartidor en Camino', 'Pedido desde Herrera en ruta', '🛵', '8095550199')">📞 Call-Noti Demo</button>
    <button class="btn-opcion-acordeon" onclick="alert('🎁 Código de Embajador: SD-GIRASOLES20\n¡Compártelo y gana Coins!')">🎁 Código Embajador</button>
    <button class="btn-opcion-acordeon" onclick="alert('🚦 Tráfico SD: Fluido en Kennedy y 27 de Febrero.')">🚦 Estado Tráfico SD</button>
    <button class="btn-opcion-acordeon" onclick="alert('🍕 Modo Chercha: Sala de pedido grupal #SD-8821 activa.')">🍕 Pedido en Grupo</button>
  </div>

  <!-- Call Noti Superior -->
  <div id="call-noti-banner" class="call-noti-banner">
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="call-avatar" style="font-size:20px; background:rgba(0,230,118,0.2); padding:8px; border-radius:50%; border:1px solid var(--neon-green);">🛵</div>
      <div>
        <div id="call-title" style="font-size:11px; font-weight:800; color:var(--neon-green);">Llamada Entrante</div>
        <div id="call-subtitle" style="font-size:9px; color:#aaa;">Toque para contestar sin bloquear</div>
      </div>
    </div>
    <div style="display:flex; gap:6px;">
      <button onclick="responderCall()" style="background:var(--neon-green); color:#000; border:none; padding:6px 12px; border-radius:10px; font-weight:800; font-size:10px; cursor:pointer;">Contestar</button>
      <button onclick="colgarCall()" style="background:rgba(255,82,82,0.2); color:#ff5252; border:1px solid #ff5252; padding:6px 10px; border-radius:10px; font-weight:800; font-size:10px; cursor:pointer;">Colgar</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Inicializar Mapa Centrado en Santo Domingo
    const map = L.map('map', { zoomControl: false }).setView([18.4861, -69.9312], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Capa Oscura Dark Neon
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // 2. Base Completa de 200+ Comercios en Todos los Sectores de Santo Domingo
    const sectoresSD = [
      { nombre: "Girasoles", lat: 18.5130, lng: -69.9750 },
      { nombre: "Pantoja", lat: 18.5265, lng: -69.9910 },
      { nombre: "Los Alcarrizos", lat: 18.5380, lng: -70.0150 },
      { nombre: "Herrera", lat: 18.4750, lng: -69.9650 },
      { nombre: "Piantini", lat: 18.4710, lng: -69.9310 },
      { nombre: "Naco", lat: 18.4750, lng: -69.9230 },
      { nombre: "Bella Vista", lat: 18.4550, lng: -69.9450 },
      { nombre: "Gazcue", lat: 18.4670, lng: -69.8970 },
      { nombre: "Zona Colonial", lat: 18.4730, lng: -69.8860 },
      { nombre: "Villa Mella", lat: 18.5450, lng: -69.9020 },
      { nombre: "Sabana Perdida", lat: 18.5310, lng: -69.8680 },
      { nombre: "Ensanche Ozama", lat: 18.4850, lng: -69.8690 }
    ];

    const tipos = [
      { cat: "Restaurante", emoji: "🍔", nombre: "Pica Pollo Expreso" },
      { cat: "Colmado", emoji: "🍺", nombre: "Colmado La Bendición" },
      { cat: "Farmacia", emoji: "💊", nombre: "Farmacia Punto Vital" },
      { cat: "Supermercado", emoji: "🛒", nombre: "Supermercado Express" }
    ];

    const grupoPines = L.layerGroup().addTo(map);

    for (let i = 1; i <= 200; i++) {
      const sec = sectoresSD[i % sectoresSD.length];
      const tipo = tipos[i % tipos.length];
      
      const latVar = sec.lat + (Math.sin(i) * 0.015);
      const lngVar = sec.lng + (Math.cos(i) * 0.015);

      const iconoCustom = L.divIcon({
        className: 'pin-masivo-neon',
        html: `<div>${tipo.emoji}</div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 19]
      });

      const marker = L.marker([latVar, lngVar], { icon: iconoCustom });
      marker.on('click', () => {
        alert(`🏪 ${tipo.nombre} #${i} (${sec.nombre})\nCategoría: ${tipo.cat}\nEstado: 🟢 ABIERTOS 24/7\nMétodos: Efectivo, Tarjeta, ConveniencePay`);
      });
      grupoPines.addLayer(marker);
    }

    // 3. Controladores de Interfaz
    function toggleMenuMaster() {
      document.getElementById('acordeon-lateral').classList.toggle('active');
    }

    function cerrarSplash() {
      localStorage.setItem('convenience_v3', 'true');
      document.getElementById('splash-bienvenida').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('convenience_v3')) {
        document.getElementById('splash-bienvenida').classList.add('hidden');
      }
    });

    // Call-Noti Lógica
    function lanzarCallNoti(titulo, subtitulo, icono, tel) {
      document.getElementById('call-title').innerText = titulo;
      document.getElementById('call-subtitle').innerText = subtitulo;
      document.getElementById('call-avatar').innerText = icono;
      document.getElementById('call-noti-banner').classList.add('active');
      window.callTelActivo = tel;
    }

    function responderCall() {
      document.getElementById('call-noti-banner').classList.remove('active');
      if (window.callTelActivo) window.location.href = `tel:${window.callTelActivo}`;
    }

    function colgarCall() {
      document.getElementById('call-noti-banner').classList.remove('active');
    }
  </script>
</body>
</html>
<style>
  /* Filtro Dark Neon automático sobre el mapa libre para evitar errores de API */
  .leaflet-layer, .leaflet-control-zoom, .leaflet-popup {
    filter: brightness(0.85) invert(1) contrast(2.2) hue-rotate(200deg) saturate(0.8) !important;
  }
  /* Asegurar visibilidad perfecta de los pines */
  .pin-masivo-neon {
    background: #141414 !important;
    border: 2px solid #00E676 !important;
    box-shadow: 0 0 16px rgba(0, 230, 118, 0.9) !important;
    border-radius: 50% !important;
    width: 38px !important;
    height: 38px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 16px !important;
    z-index: 1000 !important;
  }
</style>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      if (typeof map !== 'undefined' && map && typeof L !== 'undefined') {
        
        // 1. Remover capas de mapas anteriores rotas y usar OpenStreetMap libre
        map.eachLayer((layer) => {
          if (layer instanceof L.TileLayer) {
            map.removeLayer(layer);
          }
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // 2. Coordenadas reales ampliadas de los sectores de Santo Domingo
        const sectoresSD = [
          { nombre: "Girasoles", lat: 18.5130, lng: -69.9750 },
          { nombre: "Pantoja", lat: 18.5265, lng: -69.9910 },
          { nombre: "Los Alcarrizos", lat: 18.5380, lng: -70.0150 },
          { nombre: "Herrera", lat: 18.4750, lng: -69.9650 },
          { nombre: "Piantini", lat: 18.4710, lng: -69.9310 },
          { nombre: "Naco", lat: 18.4750, lng: -69.9230 },
          { nombre: "Bella Vista", lat: 18.4550, lng: -69.9450 },
          { nombre: "Gazcue", lat: 18.4670, lng: -69.8970 },
          { nombre: "Zona Colonial", lat: 18.4730, lng: -69.8860 },
          { nombre: "Villa Mella", lat: 18.5450, lng: -69.9020 },
          { nombre: "Sabana Perdida", lat: 18.5310, lng: -69.8680 },
          { nombre: "Ensanche Ozama", lat: 18.4850, lng: -69.8690 }
        ];

        const tipos = [
          { cat: "Restaurante", emoji: "🍔", nombre: "Pica Pollo Expreso" },
          { cat: "Colmado", emoji: "🍺", nombre: "Colmado La Bendición" },
          { cat: "Farmacia", emoji: "💊", nombre: "Farmacia Punto Vital" },
          { cat: "Supermercado", emoji: "🛒", nombre: "Supermercado Express" }
        ];

        if (window.grupoPinesMaster) {
          map.removeLayer(window.grupoPinesMaster);
        }
        window.grupoPinesMaster = L.layerGroup().addTo(map);

        // 3. Generar y esparcir los 200 comercios correctamente por toda la capital
        for (let i = 1; i <= 200; i++) {
          const sec = sectoresSD[i % sectoresSD.length];
          const tipo = tipos[i % tipos.length];
          
          // Dispersión amplia y realista
          const latVar = sec.lat + ((i % 7 - 3) * 0.006);
          const lngVar = sec.lng + ((i % 5 - 2) * 0.006);

          const iconoCustom = L.divIcon({
            className: 'pin-masivo-neon',
            html: `<div>${tipo.emoji}</div>`,
            iconSize: [38, 38],
            iconAnchor: [19, 19]
          });

          const marker = L.marker([latVar, lngVar], { icon: iconoCustom });
          marker.on('click', () => {
            alert(`🏪 ${tipo.nombre} #${i} (${sec.nombre})\nCategoría: ${tipo.cat}\nEstado: 🟢 ABIERTOS 24/7\nMétodos: Efectivo, Tarjeta, ConveniencePay`);
          });
          window.grupoPinesMaster.addLayer(marker);
        }
      }
    }, 1200);
  });
</script>
