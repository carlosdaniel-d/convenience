<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>convenienceIA Santo Domingo</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="convenienceIA">

    <!-- Tailwind CSS & Leaflet Map -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent;
        }

        /* Mapa Estético */
        #map { 
            height: 280px; 
            border-radius: 1.25rem; 
            z-index: 10;
        }

        /* Ocultar barra de desplazamiento */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animaciones */
        .card-enter {
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Marcador de Mapa Personalizado */
        .custom-pin {
            background-color: #4f46e5;
            color: white;
            padding: 6px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* Efecto Pulso de Notificación */
        .pulse-dot {
            position: relative;
        }
        .pulse-dot::before {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="pb-28">

    <!-- Header Estilo PedidosYa -->
    <header class="bg-indigo-600 text-white px-5 py-3.5 sticky top-0 z-50 shadow-md flex justify-between items-center transition-all duration-300">
        <div class="flex items-center space-x-2.5">
            <span class="text-2xl transform hover:scale-110 transition duration-200">🛒</span>
            <h1 class="font-bold text-lg tracking-tight">convenienceIA</h1>
        </div>
        <button onclick="abrirChat()" class="bg-indigo-700/80 hover:bg-indigo-800 px-3.5 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1.5 backdrop-blur-sm active:scale-95 transition">
            <span class="pulse-dot">🤖</span>
            <span>dAcliass 24/7</span>
        </button>
    </header>

    <!-- Barra de Búsqueda y Selección de Ubicación -->
    <div class="bg-indigo-600 px-5 pb-5 pt-1 shadow-lg rounded-b-3xl">
        <div class="flex items-center text-indigo-200 text-xs mb-2.5">
            <span class="mr-1">📍</span> Ubicación: <span class="text-white font-semibold ml-1">Santo Domingo (Polígono Central)</span>
        </div>
        
        <div class="relative">
            <input type="text" id="searchInput" placeholder="¿Qué se te antoja? (Ej. Helado, Pizza, Café...)" 
                   class="w-full py-3.5 pl-11 pr-4 rounded-2xl text-gray-900 text-sm bg-white shadow-inner focus:outline-none focus:ring-2 focus:ring-amber-400 transition"
                   oninput="filtrarNegocios()">
            <span class="absolute left-4 top-4 text-gray-400 text-sm">🔍</span>
        </div>
        
        <!-- Categorías Deslizables -->
        <div class="flex space-x-2 mt-3.5 overflow-x-auto hide-scrollbar pb-1">
            <button onclick="filtrarCategoria('todos')" class="bg-amber-400 text-indigo-950 px-4 py-2 rounded-xl text-xs font-bold shadow-md shrink-0 active:scale-95 transition">⚡ Todo</button>
            <button onclick="filtrarCategoria('dulce')" class="bg-white/15 hover:bg-white/25 text-white px-4 py-2 rounded-xl text-xs font-medium shrink-0 active:scale-95 transition backdrop-blur-sm">🍦 Dulce & Frío</button>
            <button onclick="filtrarCategoria('comida')" class="bg-white/15 hover:bg-white/25 text-white px-4 py-2 rounded-xl text-xs font-medium shrink-0 active:scale-95 transition backdrop-blur-sm">🍔 Comida & Más</button>
            <button onclick="filtrarCategoria('servicios')" class="bg-white/15 hover:bg-white/25 text-white px-4 py-2 rounded-xl text-xs font-medium shrink-0 active:scale-95 transition backdrop-blur-sm">🔧 Urgencias</button>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="max-w-md mx-auto px-4 mt-5 space-y-5">
        
        <!-- Banner del Asistente dAcliass -->
        <div class="bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 text-white p-5 rounded-3xl shadow-xl relative overflow-hidden border border-indigo-700/50">
            <div class="flex justify-between items-start relative z-10">
                <div class="pr-3">
                    <span class="bg-amber-400 text-indigo-950 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Asistente Contextual</span>
                    <h2 class="font-bold text-base mt-1.5 tracking-tight">¡Hola! Soy dAcliass 🤖</h2>
                    <p class="text-xs text-indigo-200 mt-1 leading-relaxed">¿Un café o un helado en Piantini? Encuentro las mejores ofertas con delivery relámpago.</p>
                </div>
                <button onclick="abrirChat()" class="bg-amber-400 hover:bg-amber-300 text-indigo-950 p-3.5 rounded-2xl shadow-lg font-bold text-lg active:scale-90 transition duration-200">
                    💬
                </button>
            </div>
        </div>

        <!-- Mapa Moderno (CartoDB Positron) -->
        <div class="bg-white p-3.5 rounded-3xl shadow-md border border-gray-100">
            <div class="flex justify-between items-center mb-2 px-1">
                <h3 class="text-xs font-extrabold text-gray-400 uppercase tracking-wider">MAPA Y RUTA EN VIVO</h3>
                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">● Cobertura SD</span>
            </div>
            <div id="map"></div>
        </div>

        <!-- Listado Dinámico de Comercios -->
        <div>
            <div class="flex justify-between items-center mb-3 px-1">
                <h3 class="font-bold text-gray-900 text-sm">NEGOCIOS & DESCUENTOS EN VIVO</h3>
                <span class="text-xs text-indigo-600 font-semibold cursor-pointer">Ver todos</span>
            </div>
            <div id="listaNegocios" class="space-y-3.5">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>
    </main>

    <!-- Botón Flotante Inteligente dAcliass -->
    <button onclick="abrirChat()" class="fixed bottom-20 right-4 bg-indigo-600 text-white p-4 rounded-full shadow-2xl border-2 border-white z-40 active:scale-90 transition duration-200 flex items-center justify-center">
        <span class="text-xl">🤖</span>
    </button>

    <!-- Navegación Inferior Nativa -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-200/80 py-2.5 px-6 flex justify-around items-center z-50 shadow-2xl">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center text-indigo-600 active:scale-90 transition">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold mt-0.5">Explorar</span>
        </button>
        <button onclick="window.scrollTo({top:280, behavior:'smooth'})" class="flex flex-col items-center text-gray-400 hover:text-indigo-600 active:scale-90 transition">
            <span class="text-xl">🗺️</span>
            <span class="text-[10px] font-medium mt-0.5">Mapa</span>
        </button>
        <button onclick="abrirChat()" class="flex flex-col items-center text-gray-400 hover:text-indigo-600 active:scale-90 transition">
            <span class="text-xl">⚡</span>
            <span class="text-[10px] font-medium mt-0.5">dAcliass</span>
        </button>
    </nav>

    <!-- Scripts de la Aplicación -->
    <script>
        let mapa;
        let marcadores = [];
        let negociosGlobal = [];

        // Inicializar Mapa con capa aesthetic de CartoDB
        function inicializarMapa() {
            mapa = L.map('map', { zoomControl: false }).setView([18.4861, -69.9312], 13);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '© CartoDB'
            }).addTo(mapa);

            L.control.zoom({ position: 'topright' }).addTo(mapa);
        }

        // Cargar negocios desde API o Fallback Local masivo
        async function cargarNegocios() {
            try {
                const response = await fetch('/api/negocios');
                const data = await response.json();
                negociosGlobal = data.negocios || [];
            } catch (error) {
                negociosGlobal = [
                    { id: 1, nombre: "Helados Bon (Piantini)", categoria: "dulce", sector: "Piantini", descripcion: "Abierto ahora • Cierra 10:00 PM", distancia: "A 3 min (180m)", oferta: "⚡ 2x1 Relámpago", item: "Helado de Pistacho / Vainilla ($3.50 USD)", precio: "3.50", icono: "🍦", lat: 18.4890, lng: -69.9340 },
                    { id: 2, nombre: "Colmado & Más Express (Naco)", categoria: "comida", sector: "Naco", descripcion: "Bebidas frías y abastos 24/7", distancia: "A 2 min (0.8 km)", oferta: "🔥 -20% Flash", item: "Combo Picadera + Refresco ($5.00 USD)", precio: "5.00", icono: "🏪", lat: 18.4880, lng: -69.9320 },
                    { id: 3, nombre: "Burger & Grill RD (Zona Colonial)", categoria: "comida", sector: "Zona Colonial", descripcion: "Comida rápida artesanal", distancia: "A 5 min (1.5 km)", oferta: "🍔 Menú Completo", item: "Burger Artesanal Clásica ($8.00 USD)", precio: "8.00", icono: "🍔", lat: 18.4840, lng: -69.9300 },
                    { id: 4, nombre: "Pizzería La Focaccia (Gazcue)", categoria: "comida", sector: "Gazcue", descripcion: "Pizza a la leña artesanal", distancia: "A 7 min (2.1 km)", oferta: "⚡ 15% Descuento", item: "Pizza Napolitana Familiar ($12.00 USD)", precio: "12.00", icono: "🍕", lat: 18.4820, lng: -69.9280 },
                    { id: 5, nombre: "Café de París (Bella Vista)", categoria: "dulce", sector: "Bella Vista", descripcion: "Café de origen y repostería fina", distancia: "A 1 min (100m)", oferta: "☕ Descuento Mañana", item: "Cappuccino + Donut Artesanal ($4.00 USD)", precio: "4.00", icono: "☕", lat: 18.4895, lng: -69.9350 }
                ];
            }
            renderizarNegocios(negociosGlobal);
            actualizarMapa(negociosGlobal);
        }

        function renderizarNegocios(lista) {
            const contenedor = document.getElementById('listaNegocios');
            contenedor.innerHTML = '';
            
            if (lista.length === 0) {
                contenedor.innerHTML = '<div class="text-center text-gray-400 py-8 text-xs font-medium">No hay comercios disponibles para esta búsqueda.</div>';
                return;
            }

            lista.forEach((n, index) => {
                const card = document.createElement('div');
                card.className = "card-enter bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex flex-col space-y-3 hover:shadow-md transition duration-200";
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex space-x-3 items-center">
                            <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-2xl shadow-inner">
                                ${n.icono}
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 text-sm leading-tight">${n.nombre}</h4>
                                <p class="text-xs text-gray-500 mt-0.5">${n.descripcion} • <span class="text-indigo-600 font-semibold">${n.distancia}</span></p>
                            </div>
                        </div>
                        <span class="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-wider">Abierto</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center border border-slate-100">
                        <div>
                            <span class="text-[11px] font-bold text-amber-600 block">${n.oferta}</span>
                            <span class="text-xs text-gray-700 font-medium">${n.item}</span>
                        </div>
                        <button onclick="pedirItem('${n.nombre}', '${n.precio}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md active:scale-95 transition">
                            Pedir ($${n.precio})
                        </button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function actualizarMapa(lista) {
            marcadores.forEach(m => mapa.removeLayer(m));
            marcadores = [];

            lista.forEach(n => {
                if(n.lat && n.lng) {
                    const customIcon = L.divIcon({
                        className: 'custom-pin-wrapper',
                        html: `<div class="custom-pin">${n.icono}</div>`,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const marker = L.marker([n.lat, n.lng], { icon: customIcon }).addTo(mapa)
                        .bindPopup(`<div style="font-family: sans-serif;"><b>${n.nombre}</b><br><span style="color:#d97706; font-size: 11px; font-weight: bold;">${n.oferta}</span></div>`);
                    marcadores.push(marker);
                }
            });
        }

        function filtrarCategoria(cat) {
            if(cat === 'todos') {
                renderizarNegocios(negociosGlobal);
                actualizarMapa(negociosGlobal);
            } else {
                const filtrados = negociosGlobal.filter(n => n.categoria.includes(cat));
                renderizarNegocios(filtrados);
                actualizarMapa(filtrados);
            }
        }

        function filtrarNegocios() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = negociosGlobal.filter(n => 
                n.nombre.toLowerCase().includes(query) || 
                n.categoria.toLowerCase().includes(query) ||
                n.sector.toLowerCase().includes(query) ||
                n.item.toLowerCase().includes(query)
            );
            renderizarNegocios(filtrados);
            actualizarMapa(filtrados);
        }

        function abrirChat() {
            const promptUser = prompt("🤖 dAcliass 24/7 (Asistente Santo Domingo):\n¿Qué antojo o necesidad tienes en este momento?");
            if(promptUser) {
                alert("🤖 dAcliass: Analizando opciones en Santo Domingo para '" + promptUser + "'. ¡Te recomendamos los comercios con delivery más cercano!");
            }
        }

        function pedirItem(nombre, precio) {
            if(confirm(`¿Confirmas tu pedido en ${nombre} por $${precio} USD?`)) {
                alert("¡Pedido realizado con éxito! Tu delivery va en camino 🛵💨");
            }
        }

        window.onload = () => {
            inicializarMapa();
            cargarNegocios();
        };
    </script>
</body>
</html>
