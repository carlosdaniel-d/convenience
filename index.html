<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>convenienceIA - Santo Domingo (Base Master)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-dark: #050505;
      --neon-green: #00E676;
      --neon-blue: #00b0ff;
      --card-bg: rgba(12, 12, 12, 0.95);
      --border-color: rgba(0, 230, 118, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; background: var(--bg-dark); color: #fff; overflow: hidden; }

    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Header Maestro Unificado */
    .master-header {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(18px);
      border: 1px solid var(--border-color); border-radius: 20px;
      padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      display: flex; flex-direction: column; gap: 8px;
    }

    .header-top-row { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 15px; color: var(--neon-green); display: flex; align-items: center; gap: 6px; }
    
    .header-badges-right { display: flex; align-items: center; gap: 6px; }
    
    .badge-pill {
      background: rgba(20, 20, 20, 0.9); border: 1px solid #333; padding: 4px 10px;
      border-radius: 12px; font-size: 10px; font-weight: bold; color: #ccc; cursor: pointer;
    }
    .badge-pill.coins { border-color: #ffd700; color: #ffd700; font-weight: 900; }
    .badge-pill.primary { border-color: var(--neon-green); color: var(--neon-green); }

    .header-address-row {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(20, 20, 20, 0.6); border: 1px solid rgba(255,255,255,0.06);
      padding: 6px 10px; border-radius: 10px; font-size: 10px; color: #aaa;
    }

    /* Filtros por Sector */
    .filtros-sectores-bar {
      display: flex; gap: 6px; overflow-x: auto; padding-top: 2px; scrollbar-width: none;
    }
    .filtros-sectores-bar::-webkit-scrollbar { display: none; }
    .chip-sector {
      background: rgba(20, 20, 20, 0.8); border: 1px solid #333; color: #ccc;
      padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 700;
      white-space: nowrap; cursor: pointer; transition: all 0.2s;
    }
    .chip-sector.active, .chip-sector:hover {
      background: var(--neon-green); border-color: var(--neon-green); color: #000;
    }

    /* Pines Neón */
    .pin-masivo-neon {
      background: #0f0f0f !important; border: 2px solid var(--neon-green) !important;
      border-radius: 50% !important; width: 38px !important; height: 38px !important;
      display: flex !important; align-items: center !important; justify-content: center !important;
      font-size: 16px !important; z-index: 9999 !important;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.7) !important;
    }

    /* Toast Container */
    .toast-container-app {
      position: fixed; bottom: 85px; right: 15px; z-index: 999999;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast-notification {
      background: rgba(18, 18, 18, 0.96); border: 1px solid var(--neon-green);
      color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 11px; font-weight: bold;
      backdrop-filter: blur(12px); box-shadow: 0 6px 20px rgba(0,0,0,0.8);
      pointer-events: auto; transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
      max-width: 260px; display: flex; align-items: center; gap: 8px;
    }
    .toast-notification.active { transform: translateX(0); }
  </style>
</head>
<body>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Header Maestro Unificado -->
  <header class="master-header">
    <div class="header-top-row">
      <div class="brand">🟢 convenienceIA</div>
      <div class="header-badges-right">
        <button class="badge-pill coins" onclick="mostrarToast('Monedero ConveniencePay activo', '💳')">🪙 <span id="lbl-coins-usuario">250</span></button>
        <button class="badge-pill primary" onclick="obtenerUbicacionGPSReal()">📍 GPS</button>
      </div>
    </div>

    <div class="header-address-row">
      <span>📍 <span id="lbl-dir-actual">Calle Principal #14, Los Girasoles</span></span>
      <button onclick="cambiarDireccionPrompt()" style="background:none; border:none; color:var(--neon-green); font-weight:bold; cursor:pointer; font-size:10px;">Cambiar</button>
    </div>

    <div class="filtros-sectores-bar">
      <button class="chip-sector active" onclick="filtrarSectorMapa('TODOS', this)">⚡ Todos</button>
      <button class="chip-sector" onclick="filtrarSectorMapa('Girasoles', this)">Girasoles</button>
      <button class="chip-sector" onclick="filtrarSectorMapa('Pantoja', this)">Pantoja</button>
      <button class="chip-sector" onclick="filtrarSectorMapa('Herrera', this)">Herrera</button>
      <button class="chip-sector" onclick="filtrarSectorMapa('Piantini', this)">Piantini</button>
      <button class="chip-sector" onclick="filtrarSectorMapa('Naco', this)">Naco</button>
    </div>
  </header>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container-app"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // Inicializar Mapa en Santo Domingo
    const map = L.map('map', { zoomControl: false }).setView([18.4861, -69.9312], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Pines de Comercios SD
    const sectoresSD = [
      { nombre: "Girasoles", lat: 18.5130, lng: -69.9750 },
      { nombre: "Pantoja", lat: 18.5265, lng: -69.9910 },
      { nombre: "Herrera", lat: 18.4750, lng: -69.9650 },
      { nombre: "Piantini", lat: 18.4710, lng: -69.9310 },
      { nombre: "Naco", lat: 18.4750, lng: -69.9230 }
    ];

    const tipos = [
      { cat: "Restaurante", emoji: "🍔", nombre: "Pica Pollo Expreso" },
      { cat: "Colmado", emoji: "🍺", nombre: "Colmado La Bendición" },
      { cat: "Farmacia", emoji: "💊", nombre: "Farmacia Punto Vital" },
      { cat: "Supermercado", emoji: "🛒", nombre: "Supermercado Express" }
    ];

    const grupoPines = L.layerGroup().addTo(map);

    for (let i = 1; i <= 100; i++) {
      const sec = sectoresSD[i % sectoresSD.length];
      const tipo = tipos[i % tipos.length];
      
      const latVar = sec.lat + ((i % 7 - 3) * 0.0075);
      const lngVar = sec.lng + ((i % 5 - 2) * 0.0075);

      const iconoCustom = L.divIcon({
        className: 'pin-masivo-neon',
        html: `<div>${tipo.emoji}</div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 19]
      });

      const marker = L.marker([latVar, lngVar], { icon: iconoCustom });
      marker.on('click', () => {
        mostrarToast(`Seleccionado: ${tipo.nombre} en ${sec.nombre}`, "📍");
      });
      grupoPines.addLayer(marker);
    }

    // Utilidad Toast
    function mostrarToast(mensaje, icono = "⚡") {
      const contenedor = document.getElementById('toast-container');
      if (!contenedor) return;
      const toast = document.createElement('div');
      toast.className = 'toast-notification';
      toast.innerHTML = `<span style="font-size:16px;">${icono}</span> <span>${mensaje}</span>`;
      contenedor.appendChild(toast);
      setTimeout(() => toast.classList.add('active'), 50);
      setTimeout(() => {
        toast.classList.remove('active');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // GPS Real
    function obtenerUbicacionGPSReal() {
      if (!navigator.geolocation) {
        mostrarToast("Geolocalización no soportada.", "❌");
        return;
      }
      mostrarToast("Buscando ubicación GPS...", "📍");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 16);
          document.getElementById('lbl-dir-actual').innerText = `GPS Activo (${pos.coords.latitude.toFixed(3)}, ${pos.coords.longitude.toFixed(3)})`;
          mostrarToast("¡Ubicación GPS sincronizada!", "✅");
        },
        () => { mostrarToast("Error al obtener GPS.", "⚠️"); },
        { enableHighAccuracy: true }
      );
    }

    function cambiarDireccionPrompt() {
      const nueva = prompt("Ingresa tu dirección exacta en Santo Domingo:", "Piantini");
      if (nueva) document.getElementById('lbl-dir-actual').innerText = nueva;
    }

    function filtrarSectorMapa(sectorNombre, btn) {
      document.querySelectorAll('.chip-sector').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const coords = {
        "TODOS": { lat: 18.4861, lng: -69.9312, zoom: 13 },
        "Girasoles": { lat: 18.5130, lng: -69.9750, zoom: 15 },
        "Pantoja": { lat: 18.5265, lng: -69.9910, zoom: 15 },
        "Herrera": { lat: 18.4750, lng: -69.9650, zoom: 15 },
        "Piantini": { lat: 18.4710, lng: -69.9310, zoom: 16 },
        "Naco": { lat: 18.4750, lng: -69.9230, zoom: 16 }
      };
      const d = coords[sectorNombre] || coords["TODOS"];
      map.setView([d.lat, d.lng], d.zoom);
      mostrarToast(`Zona: ${sectorNombre}`, "📍");
    }
  </script>
</body>
</html>
