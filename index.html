<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>convenienceIA - Santo Domingo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      color: #ffffff;
      overflow: hidden;
      position: fixed;
    }

    #map {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
      background: #0d0d0d !important;
    }

    /* MAPA DARK NEON */
    .leaflet-tile-pane {
      filter: brightness(0.65) invert(1) contrast(2.5) hue-rotate(200deg) saturate(0.4) !important;
    }

    .custom-logo-pin div {
      background: #0d0d0d !important;
      border: 2px solid #00E676 !important;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.7) !important;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ICONO DE DELIVERY EN MAPA */
    .delivery-pin div {
      background: #ff9800 !important;
      border: 2px solid #fff !important;
      box-shadow: 0 0 15px rgba(255, 152, 0, 0.9) !important;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* HEADER SUPERIOR */
    .header-app {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 440px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(24, 24, 24, 0.95);
      padding: 8px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      font-weight: 800;
      font-size: 13px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-title span {
      width: 8px; height: 8px; background: #00E676; border-radius: 50%; box-shadow: 0 0 8px #00E676;
    }

    .btn-dueno {
      background: rgba(0, 230, 118, 0.15);
      color: #00E676;
      border: 1px solid #00E676;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
      text-decoration: none;
    }

    .banner-flash {
      background: #00E676;
      color: #000;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
    }

    .input-busqueda {
      width: 100%;
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid #333;
      padding: 7px 12px;
      border-radius: 16px;
      color: #fff;
      font-size: 11px;
      outline: none;
    }

    .categorias-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categorias-scroll::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid #333;
      color: #ccc;
      padding: 5px 10px;
      border-radius: 14px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip-btn.active { background: #00E676; color: #000; border-color: #00E676; }
    .chip-btn.sos { background: #ff5252; color: #fff; border-color: #ff5252; }

    /* CONTROLES FLOTANTES LATERALES */
    .floating-sidebar {
      position: absolute;
      top: 175px;
      left: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .floating-btn {
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 14px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* BOTÓN MENÚ FLOTANTE DERECHO */
    .floating-right {
      position: absolute;
      top: 175px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .btn-tools {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #181818;
      border: 1px solid #00E676;
      color: #00E676;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,230,118,0.3);
    }

    .tools-menu {
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid #333;
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tools-menu.hidden { display: none; }

    /* BARRA INFERIOR */
    .bottom-bar {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 440px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-card {
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid #333;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 10px;
    }

    .btn-action-main {
      background: #181818;
      border: 1px solid #00E676;
      color: #00E676;
      padding: 8px 14px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #181818;
      border: 1px solid #333;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 16px;
    }
  </style>
</head>
<body>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- HEADER PRINCIPAL -->
  <div class="header-app">
    <div class="top-bar">
      <div class="brand-title"><span></span> convenienceIA</div>
      <a href="dueno.html" class="btn-dueno">Soy Dueño 💼</a>
    </div>

    <div class="banner-flash">
      ⚡ ¡OFERTA SD! Usa el cupón <span style="background:#000; color:#00E676; padding:1px 4px; border-radius:3px;">SD2026</span> (15% OFF)
    </div>

    <input type="text" class="input-busqueda" placeholder="🔍 Buscar plato o negocio (ej. Pantoja, Herrera)..." oninput="filtrarNegocios(this.value)">

    <div class="categorias-scroll">
      <button class="chip-btn active" onclick="filtrarCategoria('todos')">Todos</button>
      <button class="chip-btn" onclick="filtrarCategoria('Restaurante')">🍔 Comida</button>
      <button class="chip-btn" onclick="filtrarCategoria('Farmacia')">💊 Farmacia</button>
      <button class="chip-btn" onclick="filtrarCategoria('Supermercado')">🛒 Súper</button>
      <button class="chip-btn" onclick="filtrarCategoria('Colmado')">🍺 Colmados</button>
      <button class="chip-btn sos" onclick="alert('🚨 Asistencia SOS 24h activada en Santo Domingo.')">🚨 SOS</button>
    </div>
  </div>

  <!-- BOTONES FLOTANTES IZQUIERDA -->
  <div class="floating-sidebar">
    <button class="floating-btn" onclick="toggleModoAhorro()" style="color:#ffeb3b; border-color:#ffeb3b;">🔋 Ahorro</button>
    <button class="floating-btn" onclick="filtrarTopRated()" style="color:#ffc107; border-color:#ffc107;">⭐ Top 4.5+</button>
    <button class="floating-btn" onclick="alert('❤️ Tus favoritos están guardados.')">❤️ Favoritos</button>
  </div>

  <!-- BOTÓN Y MENÚ FLOTANTE DERECHA -->
  <div class="floating-right">
    <button class="btn-tools" onclick="toggleToolsMenu()">⚙️</button>
    <div id="tools-menu" class="tools-menu hidden">
      <button class="floating-btn" onclick="simularRutaDelivery()" style="color:#ff9800; border-color:#ff9800;">🛵 Simular Delivery</button>
      <button class="floating-btn" onclick="reproducirAlertaAudio()">🔔 Probar Audio</button>
      <button class="floating-btn" onclick="alert('💳 Métodos aceptados: Efectivo, Tarjeta, PayPal y Transferencia')">💳 Métodos Pago</button>
    </div>
  </div>

  <!-- BARRA INFERIOR DE RADIO Y TARIFAS -->
  <div class="bottom-bar">
    <div class="control-card">
      <span style="color:#00E676; font-weight:bold;">📡 Radio: <span id="radio-val">5</span> km</span>
      <span style="color:#aaa; font-size:9px;"> (Envío: RD$ <span id="costo-envio">125</span>)</span><br>
      <input type="range" min="1" max="15" value="5" style="accent-color:#00E676; width:75px;" oninput="actualizarRadio(this.value)">
    </div>

    <button class="btn-action-main" onclick="document.getElementById('modal-factura').classList.remove('hidden')">🛒 Carrito & Pedidos</button>
  </div>

  <!-- MODAL DE TICKET / CARRITO -->
  <div id="modal-factura" class="modal-overlay hidden">
    <div class="modal-box">
      <button onclick="document.getElementById('modal-factura').classList.add('hidden')" style="background:none;border:none;color:#aaa;float:right;font-size:18px;cursor:pointer;">&times;</button>
      <h3 style="color:#00E676; margin-bottom:8px; font-size:14px;">🧾 Ticket Digital & Pedidos</h3>
      <div style="font-size:11px; color:#ccc; border-top:1px dashed #444; border-bottom:1px dashed #444; padding:8px 0; margin:8px 0;">
        <p>• Sincronizado con localStorage ✅</p>
        <p>• Tarifa de Delivery actual: <strong style="color:#00E676;">RD$ <span id="modal-envio">125</span></strong></p>
        <p>• Cobertura activa: Santo Domingo Oeste & D.N.</p>
      </div>
      <button onclick="document.getElementById('modal-factura').classList.add('hidden')" class="btn-action-main" style="width:100%; background:#00E676; color:#000;">Confirmar Pedido 🛵</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    let map;
    let marcadoresGroup;
    let deliveryMarker = null;

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        map = L.map('map', { zoomControl: false }).setView([18.4861, -69.9312], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: ''
        }).addTo(map);

        marcadoresGroup = L.layerGroup().addTo(map);
        renderizarMarcadores(listaNegocios);
        map.invalidateSize();
      }, 200);
    });

    const listaNegocios = [
      { id: 1, nombre: "Chef Pepper Piantini", cat: "Restaurante", lat: 18.4712, lng: -69.9315 },
      { id: 2, nombre: "Farmacia Carol - Naco", cat: "Farmacia", lat: 18.4758, lng: -69.9234 },
      { id: 3, nombre: "Supermercado Bravo Enriquillo", cat: "Supermercado", lat: 18.4510, lng: -69.9520 },
      { id: 4, nombre: "Colmado Calle G (Girasoles)", cat: "Colmado", lat: 18.5120, lng: -69.9750 },
      { id: 5, nombre: "Colmado Popular 24h", cat: "Colmado", lat: 18.5145, lng: -69.9721 },
      { id: 6, nombre: "L&R Comercial Pantoja", cat: "Supermercado", lat: 18.5250, lng: -69.9910 },
      { id: 7, nombre: "Distribuidora Pantoja", cat: "Farmacia", lat: 18.5280, lng: -69.9885 },
      { id: 8, nombre: "La Clave Comercial (Alcarrizos)", cat: "Supermercado", lat: 18.5385, lng: -70.0150 },
      { id: 9, nombre: "Jeeh Games Store", cat: "Restaurante", lat: 18.5410, lng: -70.0120 },
      { id: 10, nombre: "L&R Comercial Deluxe (Herrera)", cat: "Supermercado", lat: 18.4750, lng: -69.9650 },
      { id: 11, nombre: "Food Shop & Bar Herrera", cat: "Restaurante", lat: 18.4780, lng: -69.9620 }
    ];

    function renderizarMarcadores(datos) {
      if (!marcadoresGroup) return;
      marcadoresGroup.clearLayers();
      datos.forEach(n => {
        const customIcon = L.divIcon({
          className: 'custom-logo-pin',
          html: `<div>📍</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = L.marker([n.lat, n.lng], { icon: customIcon });
        marker.bindPopup(`<strong style="color:#000;">${n.nombre}</strong><br><span style="color:#666;">${n.cat}</span>`);
        marcadoresGroup.addLayer(marker);
      });
    }

    function filtrarCategoria(cat) {
      if (cat === 'todos') {
        renderizarMarcadores(listaNegocios);
      } else {
        renderizarMarcadores(listaNegocios.filter(n => n.cat === cat));
      }
    }

    function filtrarNegocios(q) {
      const query = q.toLowerCase();
      renderizarMarcadores(listaNegocios.filter(n => n.nombre.toLowerCase().includes(query) || n.cat.toLowerCase().includes(query)));
    }

    function toggleModoAhorro() {
      document.body.style.filter = document.body.style.filter === "grayscale(100%)" ? "none" : "grayscale(100%)";
      alert("🔋 Modo Ahorro alternado.");
    }

    function filtrarTopRated() {
      const top = listaNegocios.filter((_, idx) => idx % 2 === 0);
      renderizarMarcadores(top);
      alert("⭐ Mostrando comercios mejor calificados (4.5+).");
    }

    function toggleToolsMenu() {
      const menu = document.getElementById('tools-menu');
      menu.classList.toggle('hidden');
    }

    // 1. CÁLCULO DINÁMICO DE ENVÍO POR RADIO
    function actualizarRadio(val) {
      document.getElementById('radio-val').innerText = val;
      const costo = 75 + (parseInt(val) * 10); // RD$ 75 base + 10 por km
      document.getElementById('costo-envio').innerText = costo;
      document.getElementById('modal-envio').innerText = costo;
    }

    // 2. SIMULADOR DE REPARTIDOR EN VIVO
    function simularRutaDelivery() {
      alert("🛵 Repartidor asignado. Simulando ruta en vivo...");
      let paso = 0;
      const inicio = [18.5250, -69.9910]; // Pantoja
      const destino = [18.4861, -69.9312]; // Centro

      if (deliveryMarker) map.removeLayer(deliveryMarker);

      const deliveryIcon = L.divIcon({
        className: 'delivery-pin',
        html: `<div>🛵</div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 19]
      });

      deliveryMarker = L.marker(inicio, { icon: deliveryIcon }).addTo(map);

      const interval = setInterval(() => {
        paso += 0.1;
        const currentLat = inicio[0] + (destino[0] - inicio[0]) * paso;
        const currentLng = inicio[1] + (destino[1] - inicio[1]) * paso;
        deliveryMarker.setLatLng([currentLat, currentLng]);

        if (paso >= 1) {
          clearInterval(interval);
          reproducirAlertaAudio();
          alert("🎉 ¡El repartidor ha llegado a tu ubicación!");
        }
      }, 500);
    }

    // 3. AUDIO SINTETIZADO WEB
    function reproducirAlertaAudio() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }
  </script>
</body>
</html>
