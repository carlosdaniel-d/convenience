<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>convenienceIA - Santo Domingo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* FORZAR PANTALLA COMPLETA ABSOLUTA */
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      color: #ffffff;
      overflow: hidden;
      position: fixed;
    }

    /* CONTENEDOR DEL MAPA CON POSICIÓN FIJA Y ALTURA REAL */
    #map {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
      background: #0d0d0d !important;
    }

    /* FILTRO ESTÉTICO DARK NEON PARA LAS BALDOSAS */
    .leaflet-tile-pane {
      filter: brightness(0.65) invert(1) contrast(2.5) hue-rotate(200deg) saturate(0.4) !important;
    }

    /* PINES DE COMERCIOS */
    .custom-logo-pin div {
      background: #0d0d0d !important;
      border: 2px solid #00E676 !important;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.7) !important;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* INTERFAZ FLOTANTE SUPERIOR */
    .header-app {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 440px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(24, 24, 24, 0.95);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span {
      width: 8px;
      height: 8px;
      background: #00E676;
      border-radius: 50%;
      box-shadow: 0 0 8px #00E676;
    }

    .btn-dueno {
      background: rgba(0, 230, 118, 0.15);
      color: #00E676;
      border: 1px solid #00E676;
      padding: 5px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
    }

    .banner-flash {
      background: #00E676;
      color: #000;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
    }

    .input-busqueda {
      width: 100%;
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid #333;
      padding: 8px 14px;
      border-radius: 20px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .categorias-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categorias-scroll::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid #333;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip-btn.active {
      background: #00E676;
      color: #000;
      border-color: #00E676;
    }

    /* BARRA INFERIOR */
    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 440px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-card {
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 11px;
    }

    .btn-action-main {
      background: #181818;
      border: 1px solid #00E676;
      color: #00E676;
      padding: 10px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #181818;
      border: 1px solid #333;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- MAPA DE FONDO -->
  <div id="map"></div>

  <!-- HEADER Y FILTROS -->
  <div class="header-app">
    <div class="top-bar">
      <div class="brand-title"><span></span> convenienceIA</div>
      <a href="dueno.html" class="btn-dueno">Soy Dueño 💼</a>
    </div>

    <div class="banner-flash">
      ⚡ ¡OFERTA SD! Usa el cupón <span style="background:#000; color:#00E676; padding:1px 5px; border-radius:4px;">SD2026</span>
    </div>

    <input type="text" class="input-busqueda" placeholder="🔍 Buscar negocio (ej. Pantoja, Herrera)..." oninput="filtrarNegocios(this.value)">

    <div class="categorias-scroll">
      <button class="chip-btn active" onclick="filtrarCategoria('todos')">Todos</button>
      <button class="chip-btn" onclick="filtrarCategoria('Restaurante')">🍔 Comida</button>
      <button class="chip-btn" onclick="filtrarCategoria('Farmacia')">💊 Farmacia</button>
      <button class="chip-btn" onclick="filtrarCategoria('Supermercado')">🛒 Súper</button>
      <button class="chip-btn" onclick="filtrarCategoria('Colmado')">🍺 Colmados</button>
    </div>
  </div>

  <!-- BARRA INFERIOR -->
  <div class="bottom-bar">
    <div class="control-card">
      <span style="color:#00E676; font-weight:bold;">📡 Radio: <span id="radio-val">5</span> km</span>
    </div>
    <button class="btn-action-main" onclick="document.getElementById('modal-factura').classList.remove('hidden')">🛒 Carrito</button>
  </div>

  <!-- MODAL -->
  <div id="modal-factura" class="modal-overlay hidden">
    <div class="modal-box">
      <button onclick="document.getElementById('modal-factura').classList.add('hidden')" style="background:none;border:none;color:#aaa;float:right;font-size:18px;cursor:pointer;">&times;</button>
      <h3 style="color:#00E676; margin-bottom:10px;">🧾 Ticket Digital</h3>
      <p style="font-size:12px; color:#ccc; margin-bottom:15px;">Pedidos sincronizados correctamente.</p>
      <button onclick="document.getElementById('modal-factura').classList.add('hidden')" class="btn-action-main" style="width:100%; background:#00E676; color:#000;">Aceptar</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // INICIALIZACIÓN BLINDADA DEL MAPA CON RETRASO DE DOM
    let map;
    let marcadoresGroup;

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        // Crear mapa asegurando coordenadas de Santo Domingo
        map = L.map('map', { zoomControl: false }).setView([18.4861, -69.9312], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: ''
        }).addTo(map);

        marcadoresGroup = L.layerGroup().addTo(map);
        renderizarMarcadores(listaNegocios);
        
        // Forzar redibujado inmediato
        map.invalidateSize();
      }, 200);
    });

    const listaNegocios = [
      { id: 1, nombre: "Chef Pepper Piantini", cat: "Restaurante", lat: 18.4712, lng: -69.9315 },
      { id: 2, nombre: "Farmacia Carol - Naco", cat: "Farmacia", lat: 18.4758, lng: -69.9234 },
      { id: 3, nombre: "Supermercado Bravo Enriquillo", cat: "Supermercado", lat: 18.4510, lng: -69.9520 },
      { id: 4, nombre: "Colmado Calle G (Girasoles)", cat: "Colmado", lat: 18.5120, lng: -69.9750 },
      { id: 5, nombre: "L&R Comercial Pantoja", cat: "Supermercado", lat: 18.5250, lng: -69.9910 },
      { id: 6, nombre: "La Clave Comercial (Alcarrizos)", cat: "Supermercado", lat: 18.5385, lng: -70.0150 },
      { id: 7, nombre: "L&R Comercial Deluxe (Herrera)", cat: "Supermercado", lat: 18.4750, lng: -69.9650 }
    ];

    function renderizarMarcadores(datos) {
      if (!marcadoresGroup) return;
      marcadoresGroup.clearLayers();
      datos.forEach(n => {
        const customIcon = L.divIcon({
          className: 'custom-logo-pin',
          html: `<div>📍</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = L.marker([n.lat, n.lng], { icon: customIcon });
        marker.bindPopup(`<strong style="color:#000;">${n.nombre}</strong><br><span style="color:#666;">${n.cat}</span>`);
        marcadoresGroup.addLayer(marker);
      });
    }

    function filtrarCategoria(cat) {
      if (cat === 'todos') {
        renderizarMarcadores(listaNegocios);
      } else {
        renderizarMarcadores(listaNegocios.filter(n => n.cat === cat));
      }
    }

    function filtrarNegocios(q) {
      const query = q.toLowerCase();
      renderizarMarcadores(listaNegocios.filter(n => n.nombre.toLowerCase().includes(query) || n.cat.toLowerCase().includes(query)));
    }
  </script>
</body>
</html>
