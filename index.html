<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>convenienceIA - Santo Domingo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="map"></div>

  <!-- Header Flotante con Buscador y Filtros (3) -->
  <div class="search-overlay">
    <div class="brand-header">
      <div class="brand-title">
        <span class="dot-live"></span>
        <h2>convenienceIA</h2>
      </div>
      <a href="dueno.html" class="btn-dueno-link">Soy Dueño 💼</a>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Buscar comercios o sectores...">
    </div>

    <!-- Filtros de Categorías -->
    <div class="categories-bar">
      <button class="cat-btn active" data-cat="Todos">Todos</button>
      <button class="cat-btn" data-cat="Supermercado">🛒 Super</button>
      <button class="cat-btn" data-cat="Farmacia 24h">💊 Farmacia</button>
      <button class="cat-btn" data-cat="Bebidas & Licores">🍷 Licores</button>
      <button class="cat-btn" data-cat="Comida Rápida & Delivery">🍕 Comida</button>
    </div>
  </div>

  <!-- Botón Flotante del Carrito (2) -->
  <button id="cart-btn" class="cart-floating-btn hidden" onclick="abrirCarrito()">
    🛒 Ver Pedido (<span id="cart-count">0</span>)
  </button>

  <!-- Modal de Pedido / Carrito (2) -->
  <div id="cart-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-business-name">Tu Pedido</h3>
        <button onclick="cerrarCarrito()" class="btn-close">&times;</button>
      </div>
      <div id="cart-items" class="cart-items-list"></div>
      <div class="cart-footer">
        <div class="cart-total">Total: <span id="cart-total-price">RD$ 0</span></div>
        <button onclick="finalizarPedido()" class="btn-checkout">Confirmar Pedido 🚀</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
<!-- ========================================== -->
<!-- BLOQUE 1000%: MODAL DE PAGO Y RESEÑAS      -->
<!-- ========================================== -->
<div id="checkout-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>💳 Método de Pago</h3>
      <button onclick="cerrarPago()" class="btn-close">&times;</button>
    </div>
    <div style="padding: 10px 0;">
      <p style="font-size: 13px; color: #aaa; margin-bottom: 10px;">Selecciona cómo deseas pagar tu pedido:</p>
      <label style="display:block; background:#242424; padding:10px; border-radius:8px; margin-bottom:8px; cursor:pointer;">
        <input type="radio" name="metodo-pago" value="Efectivo" checked> 💵 Efectivo (Pago contra entrega)
      </label>
      <label style="display:block; background:#242424; padding:10px; border-radius:8px; margin-bottom:8px; cursor:pointer;">
        <input type="radio" name="metodo-pago" value="Tarjeta"> 💳 Tarjeta de Crédito / Débito
      </label>
      <label style="display:block; background:#242424; padding:10px; border-radius:8px; margin-bottom:15px; cursor:pointer;">
        <input type="radio" name="metodo-pago" value="PayPal"> 🅿️ PayPal / Digital Wallet
      </label>
      <button onclick="procesarPagoFinal()" class="btn-checkout" style="width:100%;">Completar Pedido y Enviar 🚀</button>
    </div>
  </div>
</div>

<!-- Barra de Seguimiento de Delivery en Vivo -->
<div id="delivery-tracker" class="hidden" style="position:absolute; bottom:90px; left:50%; transform:translateX(-50%); width:90%; max-width:400px; background:rgba(18,18,18,0.95); border:1px solid #00E676; padding:12px; border-radius:16px; z-index:2000; text-align:center;">
  <p style="font-size:12px; color:#00E676; font-weight:bold; margin-bottom:4px;">🛵 MOTORIZADO EN CAMINO</p>
  <h4 id="tracker-status" style="font-size:14px; margin:0; color:#fff;">Tu pedido va en ruta...</h4>
</div>
