<script>
  function registrarComercio(event) {
    event.preventDefault();
    const nuevoNegocio = {
      nombre: document.getElementById('nombre-negocio').value,
      categoria: document.getElementById('categoria-negocio').value,
      sector: document.getElementById('sector-negocio').value,
      ubicacion: {
        latitud: 18.4861 + (Math.random() - 0.5) * 0.02,
        longitud: -69.9312 + (Math.random() - 0.5) * 0.02
      },
      productos: [
        { id: 1, nombre: "Producto Principal", precio: 350 }
      ]
    };

    // Obtener comercios actuales o inicializar array
    let comerciosGuardados = JSON.parse(localStorage.getItem('mis_negocios')) || [];
    comerciosGuardados.push(nuevoNegocio);
    localStorage.setItem('mis_negocios', JSON.stringify(comerciosGuardados));

    alert('🚀 ¡Comercio registrado y publicado en el mapa con éxito!');
    location.href = 'index.html';
  }
</script>
