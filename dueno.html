<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Dueños - convenienceIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0d0d0d; color: #fff; font-family: 'Inter', sans-serif; padding: 20px; display: flex; justify-content: center; }
    .panel-card { background: #181818; width: 100%; max-width: 480px; padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
    h2 { font-size: 20px; margin-bottom: 20px; color: #00E676; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 13px; display: block; margin-bottom: 6px; color: #aaa; }
    input, select { width: 100%; background: #242424; border: 1px solid #333; padding: 12px; border-radius: 10px; color: #fff; outline: none; }
    .btn-submit { width: 100%; background: #00E676; color: #000; font-weight: 700; border: none; padding: 14px; border-radius: 12px; margin-top: 10px; cursor: pointer; }
    .back-link { display: inline-block; margin-top: 15px; color: #888; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="panel-card">
    <h2>💼 Registrar Mi Comercio</h2>
    <form onsubmit="event.preventDefault(); alert('¡Comercio registrado con éxito!'); location.href='index.html';">
      <div class="form-group">
        <label>Nombre del Comercio</label>
        <input type="text" placeholder="Ej: Mini Market Naco" required>
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select required>
          <option value="Supermercado">Supermercado</option>
          <option value="Farmacia 24h">Farmacia 24h</option>
          <option value="Bebidas & Licores">Bebidas & Licores</option>
          <option value="Comida Rápida & Delivery">Comida Rápida</option>
        </select>
      </div>
      <div class="form-group">
        <label>Sector (Santo Domingo)</label>
        <input type="text" placeholder="Ej: Piantini, Bella Vista..." required>
      </div>
      <button type="submit" class="btn-submit">Dar de Alta Comercio 🚀</button>
    </form>
    <a href="index.html" class="back-link">← Volver al Mapa</a>
  </div>
</body>
</html>
