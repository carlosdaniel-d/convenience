<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Dueños - convenienceIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0d0d0d; color: #fff; font-family: 'Inter', sans-serif; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .panel-card { background: #181818; width: 100%; max-width: 480px; padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    h2 { font-size: 20px; margin-bottom: 20px; color: #00E676; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 13px; display: block; margin-bottom: 6px; color: #aaa; }
    input, select { width: 100%; background: #242424; border: 1px solid #333; padding: 12px; border-radius: 10px; color: #fff; outline: none; font-size: 14px; box-sizing: border-box; }
    .btn-submit { width: 100%; background: #00E676; color: #000; font-weight: 700; border: none; padding: 14px; border-radius: 12px; margin-top: 10px; cursor: pointer; font-size: 15px; }
    .back-link { display: inline-block; margin-top: 15px; color: #888; text-decoration: none; font-size: 13px; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="panel-card">
    <h2>💼 Registrar Mi Comercio</h2>
    
    <!-- Formulario con ID para capturar los datos correctamente -->
    <form id="dueno-form" onsubmit="registrarComercio(event)">
      <div class="form-group">
        <label>Nombre del Comercio</label>
        <input type="text" id="nombre-negocio" placeholder="Ej: Colmado Don Chicho" required>
      </div>
      
      <div class="form-group">
        <label>Categoría</label>
        <select id="categoria-negocio" required>
          <option value="Supermercado">Supermercado</option>
          <option value="Farmacia 24h">Farmacia 24h</option>
          <option value="Bebidas & Licores">Bebidas & Licores</option>
          <option value="Comida Rápida & Delivery">Comida Rápida</option>
        </select>
      </div>

      <div class="form-group">
        <label>Sector (Santo Domingo)</label>
        <input type="text" id="sector-negocio" placeholder="Ej: Piantini, Naco, Gazcue..." required>
      </div>

      <button type="submit" class="btn-submit">Dar de Alta Comercio 🚀</button>
    </form>

    <a href="index.html" class="back-link">← Volver al Mapa</a>
  </div>

  <script>
    function registrarComercio(event) {
      event.preventDefault(); // Evita que la página se recargue por defecto

      // Capturar los valores escritos por el usuario
      const nombre = document.getElementById('nombre-negocio').value.trim();
      const categoria = document.getElementById('categoria-negocio').value;
      const sector = document.getElementById('sector-negocio').value.trim();

      // Crear el objeto del nuevo negocio con coordenadas aleatorias dentro de Santo Domingo
      const nuevoNegocio = {
        id: Date.now(), // ID único basado en el tiempo
        nombre: nombre,
        categoria: categoria,
        sector: sector,
        ubicacion: {
          latitud: 18.4861 + (Math.random() - 0.5) * 0.03,
          longitud: -69.9312 + (Math.random() - 0.5) * 0.03
        },
        productos: [
          { id: 1, nombre: "Especial del Día", precio: 350 },
          { id: 2, nombre: "Bebida Acompañante", precio: 100 }
        ]
      };

      // Guardar en la memoria local del navegador (localStorage)
      let comerciosGuardados = JSON.parse(localStorage.getItem('mis_negocios')) || [];
      comerciosGuardados.push(nuevoNegocio);
      localStorage.setItem('mis_negocios', JSON.stringify(comerciosGuardados));

      alert('🚀 ¡Comercio registrado con éxito! Ya aparece en el mapa.');
      
      // Redirigir al usuario de vuelta al mapa principal
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>

<!-- PANEL DE GESTIÓN DE PEDIDOS PARA EL DUEÑO  -->
<!-- ========================================== -->
<div class="panel-card" style="margin-top: 20px;">
  <h2>📥 Pedidos Recibidos en Vivo</h2>
  <div id="lista-pedidos-dueno" style="max-height: 200px; overflow-y: auto; font-size: 13px;">
    <p style="color: #666;">No hay pedidos nuevos todavía...</p>
  </div>
  <button onclick="cargarPedidosDueno()" class="btn-submit" style="background:#242424; color:#00E676; border:1px solid #00E676; margin-top:10px;">Actualizar Pedidos 🔄</button>
</div>

<script>
  function cargarPedidosDueno() {
    const contenedor = document.getElementById('lista-pedidos-dueno');
    const pedidos = JSON.parse(localStorage.getItem('pedidos_negocio')) || [];

    if (pedidos.length === 0) {
      contenedor.innerHTML = `<p style="color: #666;">No hay pedidos nuevos todavía...</p>`;
      return;
    }

    contenedor.innerHTML = pedidos.reverse().map(p => `
      <div style="background:#242424; padding:10px; border-radius:8px; margin-bottom:8px; border-left: 3px solid #00E676;">
        <strong>🕒 ${p.hora}</strong> - <span style="color:#00E676;">RD$ ${p.total}</span> (${p.metodoPago})<br>
        <small style="color:#aaa;">Estado: ${p.estado}</small>
      </div>
    `).join('');
  }

  // Cargar al abrir el panel de dueños
  window.addEventListener('DOMContentLoaded', cargarPedidosDueno);
</script>
